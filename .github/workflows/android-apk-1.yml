
name: Build Gurbani Saanjh Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Get app files
        uses: actions/checkout@v4

      - name: Extract Android app source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip='Gurbani_Saanjh_App_Source_v1.4.1.zip'

          if [[ ! -f "$zip" ]]; then
            echo "::error::Missing $zip in repository root."
            exit 1
          fi

          unzip -oq "$zip" -d .

          for required in package.json capacitor.config.json scripts/patch-android.mjs www/index.html; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Missing $required in source ZIP."
              exit 1
            fi
          done

          echo "App source extracted successfully"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and build tools
        run: |
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'platform-tools'

      - name: Install app dependencies
        env:
          GS_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm install --no-audit --no-fund
          npm run build:web

      - name: Create Android project
        env:
          GS_VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Verify release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            EXPECTED="v$(node -p 'require("./package.json").version')"

            if [[ "$GITHUB_REF_NAME" != "$EXPECTED" ]]; then
              echo "::error::Git tag does not match app version."
              exit 1
            fi
          fi

      - name: Build unsigned Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing-private.jks

          unsigned='android/app/build/outputs/apk/release/app-release-unsigned.apk'

          if [[ ! -f "$unsigned" ]]; then
            echo "::error::Unsigned APK not found."
            exit 1
          fi

          tools="$ANDROID_HOME/build-tools/36.0.0"

          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk

          version="$(node -p 'require("./package.json").version')"
          apk="Gurbani_Saanjh_v${version}.apk"

          "$tools/apksigner" sign \
            --ks signing-private.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" aligned.apk

          "$tools/apksigner" verify --verbose "$apk"

          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

          rm -f signing-private.jks aligned.apk

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Gurbani-Saanjh-Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --title "Gurbani Saanjh $GITHUB_REF_NAME" \
              --notes "Android personal trial release."
          fi
