name: Build Gurbani Saanjh Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Get app files
        uses: actions/checkout@v4

      - name: Extract Android app source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip='GS_v232_source.zip'
          if [[ ! -f "$zip" ]]; then
            echo "::error::Missing $zip in the repository root. Upload the ZIP as a file before running this workflow."
            exit 1
          fi
          unzip -oq "$zip" -d .
          for required in package.json package-lock.json capacitor.config.json scripts/patch-android.mjs www/index.html www/render-verses.js www/vishraam.js www/kirtan-book.js www/scripture-search.js www/offline/manifest.json www/offline/search.json www/offline/kosh.json www/offline/kosh-stems.json www/offline/vishraam.json www/offline/kirtan-shabads.json www/offline/ang/1.json; do
            if [[ ! -f "$required" ]]; then
              echo "::error::App source ZIP does not contain $required at its top level."
              exit 1
            fi
          done
          echo "Android source extracted successfully"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Verify offline importer and search index against fixtures
        run: |
          node scripts/bundle-offline.mjs --fixture
          node test-reader.mjs

      - name: Install dependencies (npm ci BEFORE cap sync)
        # The native voice-search plugin (@capacitor-community/speech-recognition)
        # is a native Android module: it MUST be installed from package-lock.json
        # BEFORE `npx cap sync` so Capacitor registers it in the APK. Skipping
        # this step (or running it after cap sync) ships a dead microphone.
        run: npm ci --no-audit --no-fund

      - name: Compile local app resources and verify voice bundle
        env:
          GS_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm run build:web
          if ! grep -q "GS_SPEECH" www/native-updates.js; then
            echo "::error::www/native-updates.js does not bundle the speech-recognition plugin (GS_SPEECH missing). Voice search would be dead; refusing to build."
            exit 1
          fi
          echo "Voice bundle verified: GS_SPEECH present"

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs
        env:
          GS_VERSION_CODE: ${{ github.run_number }}

      - name: Verify RECORD_AUDIO permission in manifest
        shell: bash
        run: |
          if ! grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml; then
            echo "::error::RECORD_AUDIO missing from AndroidManifest.xml; voice search cannot request the microphone."
            exit 1
          fi
          echo "RECORD_AUDIO present in manifest"

      - name: Check tag matches app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            EXPECTED="v$(node -p 'require("./package.json").version')"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED" ]]; then
              echo "::error::Git tag $GITHUB_REF_NAME does not match package.json version $EXPECTED"
              exit 1
            fi
          fi

      - name: Build unsigned release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign, verify and name APK (fixed private signing key)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing. See SETUP_ANDROID.md; never put signing keys in the repository."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing-private.jks
          unsigned='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          if [[ ! -f "$unsigned" ]]; then
            echo "::error::Unsigned release APK not found at $unsigned"
            ls -lah android/app/build/outputs/apk/release/
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          version="$(node -p 'require("./package.json").version')"
          apk="Gurbani_Saanjh_v${version}.apk"
          "$tools/apksigner" sign \
            --ks signing-private.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" aligned.apk
          "$tools/apksigner" verify --verbose "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          rm -f signing-private.jks aligned.apk

      - name: Make signed APK downloadable from Actions
        uses: actions/upload-artifact@v4
        with:
          name: Gurbani-Saanjh-Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK to GitHub Releases (version tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --title "Gurbani Saanjh $GITHUB_REF_NAME" \
              --notes "Android personal-trial release. Offline scripture from the Shabad OS database (MIT) with English word glosses from shabados/translation (CC BY-SA 4.0); non-profit personal use. Audio and live AI not included."
          fi
